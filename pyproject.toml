[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sql_data_guard"]

[project]
name = "sql-data-guard"
version = "0.0.1"
dependencies = [
  "sqlglot>=25.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.0.0",
  "docker>=7.0.0",
]
authors = [
  { name = "Imperva - Threat Reseach Infra", email = "ww.dis.imperva.threat-research-infra@thalesgroup.com" },
]
description = "Safety Layer for LLM Database Interactions"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = { file = "LICENSE.md" }

[project.urls]
Homepage = "https://github.com/ThalesGroup/sql-data-guard"
Issues = "https://github.com/ThalesGroup/sql-data-guard/issues"

[dependency-groups]
dev = ["ruff>=0.8.0", "interrogate>=1.7.0"]
test = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "duckdb>=1.0.0", "httpx>=0.27.0"]
docs = ["sphinx>=8.0.0", "sphinx-rtd-theme>=2.0.0", "myst-parser>=3.0.0"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
fail-under = 80
exclude = ["setup.py", "tests", "openspec"]
verbose = 0

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "C4"]
