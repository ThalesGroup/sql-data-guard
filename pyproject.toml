[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}
[tool.pip]
extra-index-url = ["https://pypi.org/simple"]
[project]
name = "sql-data-guard"
version = "0.2.2.dev0"
dependencies = [
    # lower bound: oldest version the test-suite passes on; upper bound: next untested major
    "sqlglot>=25.20.1,<31"
]
authors = [
  { name="Imperva - Threat Research Infra", email="ww.dis.imperva.threat-research-infra@thalesgroup.com" },
]
description = "Safety Layer for LLM Database Interactions"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
license = {file = "LICENSE.md"}

[project.urls]
Homepage = "https://github.com/ThalesGroup/sql-data-guard"
Issues = "https://github.com/ThalesGroup/sql-data-guard/issues"

[tool.ruff.lint]
select = ["F", "E9"]  # pyflakes + syntax errors

[tool.mypy]
files = ["src/sql_data_guard"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["sql_data_guard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
